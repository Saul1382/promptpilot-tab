name: 错误反馈 / Bug report
description: 报告可以稳定复现的产品问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除截图和日志中的提示词、邮箱、账号、API Key 等私人信息。安全问题请发邮件至 support@promptpilot-tab.com，不要公开提交。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 输入……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: Chrome 版本 / Edge 版本
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: PromptPilot Tab 版本
      placeholder: 可在“关于 PromptPilot Tab”中查看
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: 出现问题的 AI 网站
      placeholder: 例如 ChatGPT
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除提示词、账号、邮箱、API Key 和其他私人信息
          required: true
